name: Lint

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    tags-ignore:
      - "*"
    branches:
      - "*"
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      debug:
        description: "Open ssh debug session."
        required: true
        default: false
        type: boolean

jobs:
  lint:
    name: Run Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # run static analysis on bleeding and trailing edges
        python-version: ["3.10", "3.12", "3.14"]
        django-version:
          - "dj42" # LTS April 2026
          - "dj52" # LTS April 2028
          - "dj61" #
        exclude:
          - python-version: "3.12"
            django-version: "dj42"
          - python-version: "3.14"
            django-version: "dj42"

          - python-version: "3.10"
            django-version: "dj52"
          - python-version: "3.14"
            django-version: "dj52"

          - python-version: "3.10"
            django-version: "dj61"
          - python-version: "3.12"
            django-version: "dj61"

    env:
      TEST_PYTHON_VERSION: ${{ matrix.python-version }}
      TEST_DJANGO_VERSION: ${{ matrix.django-version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: sp
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false
      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      - name: Install Emacs
        if: ${{ github.event.inputs.debug == 'true' }}
        run: |
          sudo apt install emacs
      - name: Setup tmate session
        if: ${{ github.event.inputs.debug == 'true' }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113
        timeout-minutes: 60
      - name: Run Static Analysis
        env:
          PYTHON_PATH: ${{ steps.sp.outputs.python-path }}
        run: |
          just check -p "$PYTHON_PATH" --group "$TEST_DJANGO_VERSION"
